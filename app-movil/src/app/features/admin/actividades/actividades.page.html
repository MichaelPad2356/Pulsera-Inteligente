<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button /></ion-buttons>
    <ion-title>Actividades culturales</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/admin/actividades/nueva">
        <ion-icon slot="start" name="add-circle-outline" /> Nueva
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (actividad of actividades(); track actividad.id) {
      <ion-item>
        <ion-label>
          <h2>{{ actividad.nombre }}</h2>
          <p>{{ actividad.fecha | fechaCorta }} · {{ actividad.hora }} h · {{ nombreLugar(actividad.lugarId) }}</p>
        </ion-label>
        <ion-button slot="end" fill="clear" [routerLink]="['/admin/actividades', actividad.id]" aria-label="Editar">
          <ion-icon slot="icon-only" name="create-outline" />
        </ion-button>
        <ion-button slot="end" fill="clear" color="danger" (click)="eliminar(actividad)" aria-label="Eliminar">
          <ion-icon slot="icon-only" name="trash-outline" />
        </ion-button>
      </ion-item>
    } @empty {
      <ion-item><ion-label>No hay actividades.</ion-label></ion-item>
    }
  </ion-list>
</ion-content>
