<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button /></ion-buttons>
    <ion-title>Lugares</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/admin/lugares/nuevo">
        <ion-icon slot="start" name="add-circle-outline" /> Nuevo
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar placeholder="Buscar lugar" (ionInput)="busqueda.set($event.detail.value ?? '')" />
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (lugar of lugares(); track lugar.id) {
      <ion-item>
        <ion-icon slot="start" [name]="tipos[lugar.tipo].icono" [style.color]="tipos[lugar.tipo].color" />
        <ion-label [class.inactivo]="!lugar.activo">
          <h2>{{ lugar.nombre }}</h2>
          <p>{{ tipos[lugar.tipo].nombre }} · {{ lugar.horario }}</p>
          <p>{{ lugar.lat }}, {{ lugar.lng }}</p>
        </ion-label>
        <ion-toggle
          slot="end"
          [checked]="lugar.activo"
          (ionChange)="alternarActivo(lugar)"
          aria-label="Activo"
        />
        <ion-button slot="end" fill="clear" [routerLink]="['/admin/lugares', lugar.id]" aria-label="Editar">
          <ion-icon slot="icon-only" name="create-outline" />
        </ion-button>
        <ion-button slot="end" fill="clear" color="danger" (click)="eliminar(lugar)" aria-label="Eliminar">
          <ion-icon slot="icon-only" name="trash-outline" />
        </ion-button>
      </ion-item>
    }
  </ion-list>
</ion-content>
