<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/lugares" text="" />
    </ion-buttons>
    <ion-title>{{ esNuevo() ? 'Nuevo lugar' : 'Editar lugar' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <ion-input formControlName="nombre" label="Nombre" labelPlacement="floating" fill="outline" />
    <ion-select formControlName="tipo" label="Tipo" labelPlacement="floating" fill="outline" interface="popover">
      @for (t of tipos; track t[0]) {
        <ion-select-option [value]="t[0]">{{ t[1].nombre }}</ion-select-option>
      }
    </ion-select>
    <ion-textarea formControlName="descripcion" label="Descripción" labelPlacement="floating" fill="outline" [autoGrow]="true" />
    <ion-input formControlName="horario" label="Horario (ej. 12:00 – 22:00)" labelPlacement="floating" fill="outline" />
    <ion-input formControlName="imagen" label="URL de imagen (opcional)" labelPlacement="floating" fill="outline" type="url" />

    <h3>Ubicación</h3>
    <app-selector-ubicacion [(posicion)]="posicion" />
    <div class="fila">
      <ion-input formControlName="lat" label="Latitud" labelPlacement="floating" fill="outline" type="number" (ionChange)="coordenadasEscritas()" />
      <ion-input formControlName="lng" label="Longitud" labelPlacement="floating" fill="outline" type="number" (ionChange)="coordenadasEscritas()" />
    </div>

    <ion-toggle formControlName="activo">Visible en la app</ion-toggle>

    @if (error()) {
      <ion-text color="danger"><p>{{ error() }}</p></ion-text>
    }
    <ion-button type="submit" expand="block" [disabled]="guardando()">
      <ion-icon slot="start" name="save-outline" /> Guardar
    </ion-button>
  </form>
</ion-content>
