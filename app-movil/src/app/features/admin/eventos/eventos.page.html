<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button /></ion-buttons>
    <ion-title>Conciertos y eventos</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/admin/eventos/nuevo">
        <ion-icon slot="start" name="add-circle-outline" /> Nuevo
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (evento of eventos(); track evento.id) {
      <ion-item>
        <ion-label>
          <h2>{{ evento.artista }}</h2>
          <p>{{ evento.fecha | fechaCorta }} · {{ evento.hora }} h · {{ nombreLugar(evento.lugarId) }}</p>
        </ion-label>
        <ion-button slot="end" fill="clear" [routerLink]="['/admin/eventos', evento.id]" aria-label="Editar">
          <ion-icon slot="icon-only" name="create-outline" />
        </ion-button>
        <ion-button slot="end" fill="clear" color="danger" (click)="eliminar(evento)" aria-label="Eliminar">
          <ion-icon slot="icon-only" name="trash-outline" />
        </ion-button>
      </ion-item>
    } @empty {
      <ion-item><ion-label>No hay eventos.</ion-label></ion-item>
    }
  </ion-list>
</ion-content>
